<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
    <style>
        .box{
            background-color:rgb(102, 172, 234);
            border: 1px;
            width: 500px;
            height:300px;
            border-radius:5px;
            margin:10px;
            padding: 10px;
        }
        .label{
            width:400px;
            height:100px;
            font-size:30px ;
            border-radius:5px;
        }
        .input{
            border-radius:5px;
            height:100px;
            width: 150px;
        }
        :required {
        border: 2px solid rgb(54, 36, 36);
        background-color: #ffe0e0;
    }

    /* Styles specifically for required input fields */
    input:required {
        box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
    }
        input:focus{
                background-color: blueviolet;
                color: beige;
        }
       .btn_url{
        width:400px;
        height:50px;
        border-radius:5px;
        background-color:rgb(38, 235, 38);
        cursor: pointer;
       }
       .btn_url:hover{
        background-color: aqua;
       }
    </style>
</head>
<body>
    <div class="box" >
    <form>
        
        <label for="url" >Shorter a long url</label><br>
        <input type="text" name="url" placeholder="Enter url here" style="width:400px; " required><br>
  
        <label for="customize url" style="width:400px;height:50px; font-size: 20px; border-radius:5px">Customize url</label><br>
    
        <input list="tinyurl.com" name="url choice" required/>

<datalist id="tinyurl.com">
  <option value="tinyurl.com"></option>
  <option value="Add Domain"></option>

</datalist>
        <input type="text" name="alais" placeholder="Enter alais" required ><br><br> 
        <button class="btn_url">Shorten Url</button> 
    </form>
</div>


</body>
